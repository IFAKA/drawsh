<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDA085"/>
      <stop offset="100%" style="stop-color:#F6416C"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Pencil/pen body -->
  <g transform="translate(64,64) rotate(-45) translate(-64,-64)">
    <rect x="52" y="24" width="24" height="60" rx="2" fill="white"/>
    <!-- Pencil tip -->
    <polygon points="52,84 64,104 76,84" fill="white"/>
    <!-- Tip point -->
    <polygon points="60,96 64,104 68,96" fill="#2D3436"/>
    <!-- Pencil top -->
    <rect x="52" y="20" width="24" height="10" rx="2" fill="rgba(255,255,255,0.6)"/>
    <!-- Pencil stripe -->
    <rect x="52" y="44" width="24" height="6" fill="rgba(0,0,0,0.15)"/>
  </g>
  <!-- Squiggly line to represent drawing -->
  <path d="M28 98 Q38 86 48 92 Q58 98 68 88 Q78 78 88 86 Q95 91 100 84" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
