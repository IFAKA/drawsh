<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#f778ba"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#30363d" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#30363d" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#30363d" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#30363d" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#30363d" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#30363d" stroke-width="1"/>
  </g>

  <!-- Decorative strokes -->
  <path d="M150 450 Q200 350 280 380 T400 320" stroke="url(#stroke)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M900 200 Q950 280 1000 250 T1100 300" stroke="url(#stroke)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="180" cy="200" r="40" stroke="#58a6ff" stroke-width="3" fill="none" opacity="0.4"/>
  <rect x="1000" y="400" width="80" height="80" stroke="#a371f7" stroke-width="3" fill="none" opacity="0.4" rx="4"/>
  <line x1="250" y1="500" x2="350" y2="450" stroke="#f778ba" stroke-width="3" opacity="0.4"/>
  <path d="M950 480 L980 450 L1010 480" stroke="#58a6ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Main title -->
  <text x="640" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="700" fill="#ffffff" text-anchor="middle">drawsh</text>

  <!-- Subtitle -->
  <text x="640" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#8b949e" text-anchor="middle">Draw on any webpage</text>

  <!-- Feature tags -->
  <g transform="translate(640, 440)">
    <rect x="-300" y="0" width="120" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="-240" y="24" font-family="system-ui, sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle">Pen</text>

    <rect x="-160" y="0" width="120" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="-100" y="24" font-family="system-ui, sans-serif" font-size="14" fill="#a371f7" text-anchor="middle">Shapes</text>

    <rect x="-20" y="0" width="120" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="40" y="24" font-family="system-ui, sans-serif" font-size="14" fill="#f778ba" text-anchor="middle">Arrows</text>

    <rect x="120" y="0" width="180" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="210" y="24" font-family="system-ui, sans-serif" font-size="14" fill="#7ee787" text-anchor="middle">Auto-contrast</text>
  </g>
</svg>
